name: runbook-harness-diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact-pin catalog and corpus validation needs complete ancestry and
          # object history; a shallow checkout cannot provide that proof.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Check generated catalog outputs
        run: runbook-catalog check
      - name: Validate catalog at checked-out commit
        run: runbook-catalog validate --catalog-ref "git:aidotmarket/runbooks@$(git rev-parse HEAD):CATALOG.json"
      - name: Run optional diagnostic harness against all conformant runbooks
        env:
          KOSKADEUX_MCP_URL: ${{ secrets.KOSKADEUX_MCP_URL }}
          KOSKADEUX_MCP_TOKEN: ${{ secrets.KOSKADEUX_MCP_TOKEN }}
        run: |
          runbook-catalog select --mode harness-selection
          if [ -z "$KOSKADEUX_MCP_URL" ]; then
            echo "::notice::Scenario EXECUTION skipped: KOSKADEUX_MCP_URL secret not configured (gateway is Titan-1-local). Selection, drift, and schema checks above are authoritative for CI; scenario execution runs on Titan-1 (see runbook-catalog BQ gate 4)."
          else
            runbook-harness --mode conformant --session "CI-$(date -u +%Y%m%d)"
          fi
