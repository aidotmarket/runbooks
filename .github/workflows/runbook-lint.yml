name: runbook-lint
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CORPUS-MANIFEST.yaml pins an inventory commit and verifies every
          # declared blob against that tree; a depth-1 checkout cannot prove it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run repository tests
        run: python -m pytest -q
      - name: Check corpus inventory and pending adjudication ledger
        run: python -m runbook_tools.corpus_manifest
      - name: Check generated catalog outputs
        run: runbook-catalog check
      - name: Validate catalog at checked-out commit
        run: runbook-catalog validate --catalog-ref "git:aidotmarket/runbooks@$(git rev-parse HEAD):CATALOG.json"
      # Advisory, not a gate. Max directive S1491 and AC9 of the approved
      # truth-layer design: conformance is a convention. Findings are surfaced
      # as annotations on the run so an author sees them, but an untidy page
      # never blocks a merge and never stops a page being indexed. The steps
      # above stay blocking: they protect the integrity of the index itself
      # (inventory pins, generated-output drift, and catalog validity), which
      # is a different thing from the shape of a page.
      - name: Lint runbooks (advisory)
        continue-on-error: true
        run: |
          runbook-catalog select --mode lint-selection
          runbook-lint --mode strict --format github
