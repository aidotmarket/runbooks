  inventory_sha: ccbd3a9546c42b57900d172c594ce62518544355
  blob_oid_scope: Each git_blob_oid names the exact operational-document blob in inventory_sha, not an
    uncommitted working-tree version.
  inventory_path_semantics: When inventory_path is present, git_blob_oid resolves at inventory_sha under
    inventory_path while path names the current source or recoverable archive location.
  source_selector: runbook_tools.catalog.generator.source_paths
  refresh_required_before_execution: true
  counts:
    operational_documents: 109
    source_documents: 105
    active: 25
    grandfathered: 80
    archived: 4
policy:
  pending_is_not_authority: true
  manifest_grants_no_authority: true
  archive_is_recoverable: true
  promotion_requires_ground_truth_verification: true
  merge_or_archive_requires_section_coverage: true
  high_risk_requires_independent_review: true
risk_scale:
  P0: Security, destructive state, recovery, session, or gateway behavior with direct outage or integrity
    risk.
  P1: Material operational or governance behavior requiring truth-focused review.
  P2: Routine operational or product guidance with bounded blast radius.
  P3: Historical, scratch, or evidence-only material with no proposed current authority.
