scenario: 'id: E-02. trigger: A completed build needs optional non-gate AG advice and infra:council-comms explicitly permits that advisory dispatch. pre_conditions: live-state AG advisory eligibility, commit SHA, changed-file list, repo cwd, read-only scope, and AG server health are known. tool_or_endpoint: council_request(agent=ag, mode=review, task=<read_only_prompt>, cwd=<repo>). argument_sourcing: eligibility from current infra:council-comms; task from advisory questions plus explicit read-only instructions; cwd from the checked-out repo; evidence refs from spec, commit, and diff. idempotency: IDEMPOTENT_WITH_KEY on ag + commit_sha + review_scope. expected_success: AG returns non-gate read-only advice with no file writes and verified citations. expected_failures: missing live-state eligibility, timeout, unsupported line claim, unhealthy backend, or counting AG toward a gate. next_step_success: attach as advisory evidence and obtain CC/Kimi/GLM votes separately. next_step_failure: preserve the failure and fail closed for gate purposes; never substitute AG, MP, or DeepSeek.

  '
