schema_version: 1
provenance:
  authored_session: S1413
  authored_at: 2026-07-31
  runbooks_base_sha: a6d7534a35d921138c139bdf69aaeddd0faec100
  runbooks_base_role: durable lineage base for the authored query set
  evaluation_pin_kind: temporary commit of the checked-out corpus under test
  independent_review_status: pending
  independent_review_evidence: null
  evaluation_method: >-
    Deterministic top-three section retrieval against one internally consistent
    temporary pin made from the working corpus. Independent human or peer review
    remains pending; this fixture is not Mars self-certification.

cases:
  - id: runbook-authoring-after-process-change
    area: central-plan-close-runbook-context
    expectation: repository_authoring_guidance
    query: create or update an authoritative runbook after implementing a process change
    expected_path: README.md
    expected_heading: Working on a runbook

  - id: session-plan-context-first
    area: central-plan-close-runbook-context
    expectation: top3_actionable_section
    query: after session open obtain authoritative runbook context before kd_session_plan without inventing a consultation
    expected_runbook_id: peer-instance-discipline
    expected_heading: §E. Operate
    required_action_tokens: [RUNBOOK_CONTEXT_SELECTION_REQUIRED, runbook_consultation, signed deployed contract]

  - id: session-close-impact-evidence
    area: central-plan-close-runbook-context
    expectation: top3_actionable_section
    query: close a session with truthful runbook impact evidence without inventing documentation or filler
    expected_runbook_id: peer-instance-discipline
    expected_heading: §E. Operate
    required_action_tokens: [runbook_exit, runbook_impact, compatibility input]

  - id: credential-disclosure-repair
    area: infrastructure-discovery
    expectation: top3_actionable_section
    query: repair a credential exposure and secret disclosure without repeating the value
    expected_runbook_id: infrastructure-discovery
    expected_heading: §G. Repair
    required_action_tokens: [Treat the exposed credential as compromised, never restore the exposed credential]

  - id: hall-start
    area: council-roles-and-schema
    expectation: top3_actionable_section
    query: start a Council Hall deliberation with an explicit participant list
    expected_runbook_id: council-hall-deliberation
    expected_heading: §E. Operate
    required_action_tokens: [council_hall, action=start]

  - id: hall-no-quorum
    area: council-roles-and-schema
    expectation: top3_actionable_section
    query: diagnose no quorum in a Council Hall deliberation
    expected_runbook_id: council-hall-deliberation
    expected_heading: §F. Isolate
    required_action_tokens: [No quorum, Hall start]

  - id: peer-open-drain
    area: peer-coordination
    expectation: top3_actionable_section
    query: open a peer session and drain the unread message inbox before work
    expected_runbook_id: peer-instance-discipline
    expected_heading: §E. Operate
    required_action_tokens: [peer_msg_inbox, at-most-once]

  - id: branch-wrapper-recovery
    area: deployment-and-recovery
    expectation: top3_actionable_section
    query: repair and recover a branch after dispatcher push output by reading remote landing evidence
    expected_runbook_id: branch-landed-verification
    expected_heading: §G. Repair
    required_action_tokens: [Read the remote first, retry the push once]

  - id: council-schema-mismatch
    area: council-roles-and-schema
    expectation: top3_actionable_section
    query: diagnose a live council_request schema mismatch for a required reviewer
    expected_runbook_id: council
    expected_heading: §F. Isolate
    required_action_tokens: [live callable, required-member constants]

  - id: dispatch-gateway-timeout
    area: deployment-and-recovery
    expectation: top3_actionable_section
    query: diagnose an agent dispatch gateway timeout and inspect whether a background task exists
    expected_runbook_id: agent-dispatch
    expected_heading: §F. Isolate
    required_action_tokens: [Gateway timeout, background task id]

  - id: build-queue-reconcile
    area: central-plan-close-runbook-context
    expectation: top3_actionable_section
    query: run on-demand build queue reconciliation for HIGH_CONFIDENCE_GIT_AHEAD
    expected_runbook_id: build-queue-reconciliation
    expected_heading: §E. Operate
    required_action_tokens: [kd_reconcile_bq, auto_patch]

  - id: infrastructure-locator
    area: infrastructure-discovery
    expectation: top3_actionable_section
    query: use state_request action get to resolve a service locator from the infrastructure resource registry
    expected_runbook_id: infrastructure-discovery
    expected_heading: §E. Operate
    required_action_tokens: [state_request, action=get]

  - id: stale-queue-open
    area: queue-aging
    expectation: top3_actionable_section
    query: at session open use state_request action bq_status to classify approved but undispatched stale queue work
    expected_runbook_id: aging-policy
    expected_heading: §E. Operate
    required_action_tokens: [state_request, action=bq_status]

  - id: product-breaking-boundary
    area: product-boundaries
    expectation: top3_actionable_section
    query: classify a breaking change that merges product identities across the marketplace boundary
    expected_runbook_id: product-elaboration
    expected_heading: §H.2 BREAKING predicates
    required_action_tokens: [BREAKING, product identities]

  - id: constitution-source-drift
    area: constitution-provenance
    expectation: top3_actionable_section
    query: verify and diagnose constitution source drift against the current hash
    expected_runbook_id: constitution-history
    expected_heading: §F. Isolate
    required_action_tokens: [wrong constitution SHA, path plus digest]

  - id: review-invalid-sha
    area: council-review
    expectation: top3_actionable_section
    query: diagnose a Council review that failed because the dispatch SHA is invalid
    expected_runbook_id: council-review-collection
    expected_heading: §F. Isolate
    required_action_tokens: [git cat-file, cwd]

  - id: gate-read-only-waiver
    area: gate-waiver
    expectation: top3_actionable_section
    query: repair a tainted Gate 3 review and require a read-only independent reviewer
    expected_runbook_id: gate-procedure
    expected_heading: §G. Repair
    required_action_tokens: [read-only, non-builder]

  - id: historical-gate2-trap
    area: historical-trap
    expectation: historical_trap
    query: retired Gate 2 review agents MP AG DeepSeek dispatch pattern
    forbidden_excerpt_tokens: ['agents=[mp, ag, deepseek]']

  - id: negative-unknown-vocabulary
    area: honest-negative
    expectation: no_positive_candidate
    query: xylophonically zoetrope quincunx

  - id: negative-shared-vocabulary
    area: honest-negative
    expectation: no_positive_candidate
    query: find the current process owner documentation for nebulosity handling
